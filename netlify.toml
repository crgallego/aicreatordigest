# AI Creator Digest — https://aicreatordigest.com

[build]
  # The whole repo is published so the markdown files under /playlists and
  # /creators are fetchable by the front end. No build step — it's vanilla
  # HTML/CSS/JS.
  publish = "."
  command = "echo 'No build step — publishing static files.'"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # @netlify/blobs must stay unbundled: it reads its configuration from the
  # context Netlify injects at runtime, and bundling it can detach it from
  # that context, producing "The environment has not been configured to use
  # Netlify Blobs" on an otherwise healthy deploy.
  external_node_modules = ["@netlify/blobs"]

[functions."process-video"]
  # Synchronous, so this value is capped by the plan (30s observed) regardless
  # of what is written here. Long transcripts belong in a background function.
  timeout = 26

[functions."process-video-background"]
  timeout = 180

[functions."fetch-transcript"]
  # Normally well under a second via the vendor. The free fallback retries
  # against YouTube's bot check, and a vendor transcription job can poll for
  # a few seconds, so give it the full synchronous ceiling for headroom.
  timeout = 26

[functions."analyze-video"]
  # Kept for tests and short transcripts. NOTE: this plan caps synchronous
  # functions at 30s and silently ignores a higher value here. A 6,500 token
  # transcript was killed at exactly 30000ms on 2026-07-29, which is why
  # production analysis runs in analyze-video-background instead.
  timeout = 26

[functions."analyze-video-background"]
  # Background functions get 15 minutes, so the model is never the constraint.
  timeout = 900

[functions."compare-models-background"]
  timeout = 900

[functions."publish-video"]
  # Runs the same commit cascade as process-video (video + creator + consensus
  # + manifest + sitemap + feed) — several sequential GitHub API round trips.
  timeout = 180

[functions."notify-draft"]
  timeout = 26

[functions."reject-draft"]
  timeout = 26

[functions."review-api"]
  # Publishing runs the same multi-commit cascade as publish-video.
  timeout = 180

[functions."preview-markdown"]
  timeout = 26

# ----------------------------------------------------------------------
# Clean URLs
# ----------------------------------------------------------------------

[[redirects]]
  from = "/api/process-video"
  to = "/.netlify/functions/process-video"
  status = 200
  force = true

[[redirects]]
  from = "/api/fetch-transcript"
  to = "/.netlify/functions/fetch-transcript"
  status = 200
  force = true

# Telegram Mini App: the review editor and the draft preview it embeds.
[[redirects]]
  from = "/api/review"
  to = "/.netlify/functions/review-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/preview-markdown"
  to = "/.netlify/functions/preview-markdown"
  status = 200
  force = true

[[redirects]]
  from = "/review/*"
  to = "/web/review.html"
  status = 200

# The preview renders the real digest template against an unpublished draft.
[[redirects]]
  from = "/preview"
  to = "/web/video.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/web/index.html"
  status = 200

[[redirects]]
  from = "/playlist/*"
  to = "/web/playlist.html"
  status = 200

[[redirects]]
  from = "/video/*"
  to = "/web/video.html"
  status = 200

[[redirects]]
  from = "/creator/*"
  to = "/web/creator.html"
  status = 200

[[redirects]]
  from = "/playlists"
  to = "/web/playlists.html"
  status = 200

[[redirects]]
  from = "/digests"
  to = "/web/digests.html"
  status = 200

[[redirects]]
  from = "/creators"
  to = "/web/creators.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/web/about.html"
  status = 200

[[redirects]]
  from = "/how-we-synthesize"
  to = "/web/how-we-synthesize.html"
  status = 200

[[redirects]]
  from = "/how-this-works"
  to = "/web/how-this-works.html"
  status = 200

[[redirects]]
  from = "/chris-gallego"
  to = "/web/chris-gallego.html"
  status = 200

# Keep the function and test sources out of the served site.
# Everything below is in the repository because the repository is the project,
# not because it belongs on the website. Without force = true these rules do
# nothing at all: Netlify serves a matching static file before it consults the
# redirect table, so a rule pointing at a path that exists is silently inert.
# Both of the original rules here were in that state, and the function source
# was being served at the domain.

[[redirects]]
  from = "/netlify/*"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/web/404.html"
  status = 404
  force = true

# Writing packages. Held back deliberately: this material is intended for
# publication later or elsewhere, and putting it on the domain publishes it now.
[[redirects]]
  from = "/memory/*"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/web/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/web/404.html"
  status = 404

# ----------------------------------------------------------------------
# Headers
# ----------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/web/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/web/data/index.json"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/playlists/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/creators/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/rss+xml; charset=utf-8"
