<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator · AI Creator Digest</title>
<meta name="description" content="My profile of one of the creators I feature on AI Creator Digest, with every digest of their videos and a link to their YouTube channel.">
<meta property="og:site_name" content="AI Creator Digest">
<meta property="og:type" content="profile">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="AI Creator Digest" href="/feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23B5602B'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/assets/style.css">
<script defer src="/web/assets/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<div class="wrap">
  <header class="site-header">
    <a href="/" class="wordmark" style="text-decoration:none">
      <span class="title">AI Creator Digest</span>
      <span class="tag">aicreatordigest.com — youtube, read instead of watched</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="/">home</a>
      <a href="/playlists">playlists</a>
      <a href="/digests">digests</a>
      <a href="/creators">creators</a>
      <a href="/about">about</a>
      <span class="spacer"></span>
      <span class="issue" id="issue-marker"></span>
    </nav>
    <hr class="divider">
  </header>

  <main id="main">
    <div class="page-head">
      <div class="eyebrow">Creator</div>
      <h1 id="title">Loading…</h1>
      <p class="dek" id="bio"></p>

      <div class="credit" id="credit" hidden>
        <div class="who">
          <span class="name" id="channel-name"></span>
          <span class="sub" id="credit-sub"></span>
        </div>
        <a class="watch" id="channel-link" href="#" target="_blank" rel="noopener">visit channel ↗</a>
      </div>

      <div class="meta-row" id="collections-line"></div>
    </div>

    <section class="band">
      <h2 class="section-label">Digests</h2>
      <div class="rows" id="videos"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>AI Creator Digest © 2026</span>
    <span class="spacer"></span>
    <a href="/how-we-synthesize">how i synthesize</a>
    <a href="https://github.com/crgallego/aicreatordigest/issues/new?title=Channel%20suggestion" target="_blank" rel="noopener">submit a channel</a>
    <a href="/feed.xml">rss</a>
  </footer>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const A = window.ACD;

  const { slug } = A.routeParams("creator", ["slug"]);
  if (!slug) {
    document.getElementById("title").textContent = "Creator not found";
    document.getElementById("videos").innerHTML = A.emptyState("No creator specified", "Head back to the homepage to browse everyone I feature.");
    return;
  }

  const index = await A.loadIndex();
  A.renderIssueMarker(index);

  const videos = A.newestFirst(index.videos.filter((v) => v.creatorSlug === slug));

  const raw = await A.fetchMarkdown(`/creators/${encodeURIComponent(slug)}.md`);
  const { data } = raw ? A.parseFrontmatter(raw) : { data: {} };

  const creator = { ...(index.creators[slug] || { slug }), ...data };
  const name = creator.creatorName || slug;

  document.getElementById("title").textContent = name;
  document.getElementById("bio").textContent = creator.bio || "";

  document.getElementById("credit").hidden = false;
  document.getElementById("channel-name").textContent = creator.channelName || name;
  document.getElementById("credit-sub").textContent = A.plural(videos.length, "digest", "digests");

  const channelLink = document.getElementById("channel-link");
  if (creator.channelUrl) {
    channelLink.href = creator.channelUrl;
  } else {
    channelLink.remove();
  }

  const playlists = videos.reduce((acc, v) => {
    if (!acc.some((p) => p.slug === v.playlistSlug)) acc.push({ slug: v.playlistSlug, name: v.playlistName });
    return acc;
  }, []);
  document.getElementById("collections-line").innerHTML = playlists.length
    ? `<span>collections: <span class="v">${playlists
        .map((p) => `<a href="/playlist/${encodeURIComponent(p.slug)}">${A.escapeHtml(p.name)}</a>`)
        .join(" · ")}</span></span>`
    : "";

  document.getElementById("videos").innerHTML = videos.length
    ? videos.map(A.videoRow).join("")
    : A.emptyState("No digests yet", "They'll appear here as soon as I process one of their videos.");

  A.setMeta({
    title: name,
    description:
      creator.description ||
      creator.bio ||
      `${name} of ${creator.channelName || ""} — ${videos.length} digests on AI Creator Digest.`,
    path: `/creator/${slug}`,
    type: "profile",
  });

  A.injectJsonLd({
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    mainEntity: {
      "@type": "Person",
      name,
      description: creator.bio || undefined,
      url: creator.channelUrl || undefined,
      sameAs: creator.channelUrl ? [creator.channelUrl] : undefined,
    },
    url: `${A.SITE_URL}/creator/${slug}`,
  });
});
</script>
</body>
</html>
